<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="SellPage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <section>
        <div class="navebar">
            <div class="header">
                <h1>Header</h1>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="RentCar.html">Rent Car</a></li>
                    <li><a href="ByeCar.html">Buy Car</a></li>
                    <li><a href="SellPage.html">Sell Car</a></li>
                </ul>
            </div>

        </div>
    </section>


    <div class="container">
        <h1>Sell Your Car</h1>
        <p>Fill in your vehicle details and get the best market value for your car.</p>
        <div class="sell-card`">
            <div class="profile">
                <div class="photo-upload">

                    <div class="view-card">

                        
                        <div class="img-card">
                            <label for="fileInput1">
                                <div class="photo-preview" id="photoPreview1">
                                    <i class="fa-solid fa-car"></i>
                                    <p>Car Front Full View</p>
                                </div>
                            </label>

                            <input type="file" id="fileInput1" accept="image/*" hidden
                                onchange="previewImage(event, 'photoPreview1')">
                        </div>


                        
                        <div class="img-card">
                            <label for="fileInput2">
                                <div class="photo-preview" id="photoPreview2">
                                    <i class="fa-solid fa-car-side"></i>
                                    <p>Left Side View</p>
                                </div>
                            </label>

                            <input type="file" id="fileInput2" accept="image/*" hidden
                                onchange="previewImage(event, 'photoPreview2')">
                        </div>


                        
                        <div class="img-card">
                            <label for="fileInput3">
                                <div class="photo-preview" id="photoPreview3">
                                    <i class="fa-solid fa-car-side"></i>
                                    <p>Right Side View</p>
                                </div>
                            </label>

                            <input type="file" id="fileInput3" accept="image/*" hidden
                                onchange="previewImage(event, 'photoPreview3')">
                        </div>


                        
                        <div class="img-card">
                            <label for="fileInput4">
                                <div class="photo-preview" id="photoPreview4">
                                    <i class="fa-solid fa-car-rear"></i>
                                    <p>Car Back Side</p>
                                </div>
                            </label>

                            <input type="file" id="fileInput4" accept="image/*" hidden
                                onchange="previewImage(event, 'photoPreview4')">
                        </div>


                        
                        <div class="img-card">
                            <label for="fileInput5">
                                <div class="photo-preview" id="photoPreview5">
                                    <i class="fa-solid fa-gears"></i>
                                    <p>Engine Condition</p>
                                </div>
                            </label>

                            <input type="file" id="fileInput5" accept="image/*" hidden
                                onchange="previewImage(event, 'photoPreview5')">
                        </div>


                        
                        <div class="img-card">
                            <label for="fileInput6">
                                <div class="photo-preview" id="photoPreview6">
                                    <i class="fa-solid fa-gauge-high"></i>
                                    <p>Dashboard + Steering</p>
                                </div>
                            </label>

                            <input type="file" id="fileInput6" accept="image/*" hidden
                                onchange="previewImage(event, 'photoPreview6')">
                        </div>

                    </div>

                </div>

                <div class="profile-form">
                    <div class="user-information">
                        <div class="list">
                            <label for="">Enter Your Name</label> <br>
                            <input type="text" name="" id="" placeholder="Enter Full Name">
                        </div>

                        <div class="list">
                            <label for="">Enter Register Name</label> <br>
                            <input type="text" name="" id="" placeholder="Enter Register Name">
                        </div>

                        <div class="list">
                            <label for="">Enter Your Mobile Number</label> <br>
                            <input type="number" name="" id="" placeholder="Enter Mobile Number">
                        </div>

                        <div class="list">
                            <label for="">Enter Your Email</label> <br>
                            <input type="email" name="" id="" placeholder="Your Email">
                        </div>

                        <div class="list">
                            <label for="">Enter Your City</label> <br>
                            <input type="text" name="" id="" placeholder="Enter City">
                        </div>
                        

                        <div class="list">
                            <label for="">Enter Your Full Address</label> <br>
                            <textarea name="" id="" placeholder="Enter Address"></textarea>
                            <!-- <input type="text" name="" id="" placeholder="Your Address"> -->
                        </div>
                    </div>

                    <div class="car-information">
                        <div class="car">
                            <label for="">Enter Car Model</label>
                            <input type="text">
                        </div>

                        <div class="car">
                            <label for="">Enter Car Brand</label>
                            <input type="text">
                        </div>

                        <div class="car">
                            <label for="">Registration Year</label>
                            <input type="text">
                        </div>

                        <div class="car">
                            <label for="">Registration number</label>
                            <input type="text">
                        </div>

                        <div class="Fuel-Type">
                            <select>
                                <option>Fuel Type</option>
                                <option>Petrol</option>
                                <option>Diesel</option>
                                <option>EV</option>
                            </select>
                        </div>

                        <div class="car">
                            <label for="">Kilometers Driven</label>
                            <input type="text">
                        </div>

                        <div class="number-owners">
                            <select>
                                <option>Number of Owners</option>
                                <option>1</option>
                                <option>2</option>
                                <option>3 </option>
                            </select>
                        </div>

                    </div>
                    <div class="submit-btn">
                        <button type="submit">
                            <i class="fa-solid fa-car"></i>
                            Sell My Car
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <script>
            function previewImage(event, previewId) {

                const file = event.target.files[0];
                const preview = document.getElementById(previewId);

                if (!file) {
                    return;
                }

                if (!file.type.startsWith("image/")) {
                    alert("Please select an image file");
                    event.target.value = "";
                    return;
                }

                const reader = new FileReader();

                reader.onload = function (e) {
                    preview.innerHTML = `
                <img src="${e.target.result}" alt="Car Preview">
            `;
                };

                reader.readAsDataURL(file);
            }
        </script>


</body>

</html>
