<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link rel="stylesheet" href="profile.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- =================== NAVBAR =================== -->

    <section>
        <div class="navebar">

            <div class="header">

                <h1>DriveHub</h1>

                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="RentCar.html">Rent Car</a></li>
                    <li><a href="ByeCar.html">Buy Car</a></li>
                    <li><a href="SellPage.html">Sell Car</a></li>
                </ul>

            </div>


            <div class="navbar-pro">

                <div class="profile">

                    <i class="fa-solid fa-circle-user" id="profileIcon" onclick="toggleMenu()">
                    </i>

                    <div class="profile-menu" id="profileMenu">

                        <a href="profile.html">
                            <i class="fa-solid fa-user"></i>
                            My Profile
                        </a>

                        <a href="Setting.html">
                            <i class="fa-solid fa-gear"></i>
                            Settings
                        </a>

                        <a href="adminLogin.html">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            Logout
                        </a>

                    </div>

                </div>

            </div>

        </div>
    </section>


    <!-- =================== PROFILE SECTION =================== -->

    <main class="profile-page">

        <div class="profile-card">

            <!-- PROFILE HEADER -->

            <div class="profile-heading">

                <h2>My Profile</h2>

                <p>
                    Manage your personal information and account details
                </p>

            </div>


            <!-- PROFILE IMAGE -->

            <div class="profile-image-section">

                <div class="img-card">

                    <label for="fileInput1">

                        <div class="photo-preview" id="photoPreview1">

                            <i class="fa-solid fa-user"></i>

                        </div>

                    </label>

                    <input type="file" id="fileInput1" accept="image/*" hidden
                        onchange="previewImage(event, 'photoPreview1')">

                </div>


                <div class="image-text">

                    <h3>Profile Photo</h3>

                    <p>
                        Click the image to upload a new photo
                    </p>

                </div>

            </div>


            <!-- PROFILE FORM -->

            <form id="profileForm">

                <div class="form-grid">


                    <div class="form-group">

                        <label>Full Name</label>

                        <div class="input-box">

                            <i class="fa-solid fa-user"></i>

                            <input type="text" id="userName" placeholder="Enter your full name" required>

                        </div>

                    </div>


                    <div class="form-group">

                        <label>Mobile Number</label>

                        <div class="input-box">

                            <i class="fa-solid fa-phone"></i>

                            <input type="tel" id="userMobile" placeholder="Enter mobile number" maxlength="10" required>

                        </div>

                    </div>


                    <div class="form-group">

                        <label>Email Address</label>

                        <div class="input-box">

                            <i class="fa-solid fa-envelope"></i>

                            <input type="email" id="userEmail" placeholder="Enter your email" required>

                        </div>

                    </div>


                    <div class="form-group">
                        <label>Age</label>

                        <div class="input-box">
                            <i class="fa-solid fa-cake-candles"></i>
                            <input type="number" id="userAge" placeholder="Enter your age" min="18" max="100">
                        </div>
                    </div>


                    <!-- ADDRESS -->

                    <div class="form-group full-width">

                        <label>Address</label>

                        <div class="textarea-box">

                            <i class="fa-solid fa-location-dot"></i>

                            <textarea id="userAddress" placeholder="Enter your full address">
                            </textarea>

                        </div>

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="profile-buttons">

                    <button type="submit" class="save-btn">


                        Save Changes

                    </button>

                </div>

            </form>

        </div>

    </main>


    <script>

        function toggleMenu() {

            var menu =
                document.getElementById("profileMenu");

            if (menu.style.display === "block") {

                menu.style.display = "none";

            } else {

                menu.style.display = "block";

            }

        }


        window.addEventListener("click", function (event) {

            var menu =
                document.getElementById("profileMenu");

            var profileIcon =
                document.getElementById("profileIcon");

            if (
                !profileIcon.contains(event.target) &&
                !menu.contains(event.target)
            ) {

                menu.style.display = "none";

            }

        });


        function previewImage(event, previewId) {

            var file = event.target.files[0];

            var preview =
                document.getElementById(previewId);


            if (!file) {
                return;
            }


            if (!file.type.startsWith("image/")) {

                alert("Please select an image file");

                event.target.value = "";

                return;

            }


            var reader = new FileReader();


            reader.onload = function (e) {

                preview.innerHTML =
                    `<img src="${e.target.result}" alt="Profile Photo">`;

            };


            reader.readAsDataURL(file);

        }


        document
            .getElementById("profileForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                var name =
                    document.getElementById("userName").value.trim();

                var mobile =
                    document.getElementById("userMobile").value.trim();

                var email =
                    document.getElementById("userEmail").value.trim();


                if (
                    name === "" ||
                    mobile === "" ||
                    email === ""
                ) {

                    alert("Please fill all required fields");

                    return;

                }


                if (mobile.length !== 10) {

                    alert("Please enter valid 10 digit mobile number");

                    return;

                }


                alert("Profile Updated Successfully");

            });

    </script>

</body>

</html>
