<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="orderPage.css">
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="reserve-form">

    <div class="close">
        <i class="fa-solid fa-xmark"></i>
    </div>

    <h1>Pay ₹2,00,000 & Reserve Car for 24 hrs</h1>

    <h3>We will reserve your dream car for the next 24 hours.</h3>

    <p>
        Just a few steps away from making your dream car a reality!
        Fill in your details and complete the reservation.
    </p>

    <form>

        <div class="input-box">

            <input type="text" placeholder="Name *">

            <input type="tel" placeholder="Phone Number *">

        </div>

        <div class="input-box">

            <input type="email" placeholder="Email *">

            <input type="text" placeholder="Address">

        </div>

        <div class="payment">

            <h2>Payment Options</h2>

            <h4>
                <i class="fa-solid fa-lock"></i>
                100% Secure Payment
            </h4>

            <div class="cards">

                <img src="img/visa.png" alt="">
                <img src="img/mastercard.png" alt="">
                <img src="img/amex.png" alt="">

            </div>

            <small>Payment Gateway charges will apply</small>

        </div>

        <button type="submit">
            Reserve Now
        </button>

    </form>

</div>
</body>
</html>
