<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="addNewCar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <section>
        <div class="dashboard">
            <h1><i class="fas fa-leaf"></i>Admin</h1>

            <div class="dashboard-page">
                <a href="dashboard.html"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
                <a href="manageCard.html"><i class="fas fa-car"></i> <span>Manage Cars</span></a>
                <a href="addNewCar.html"><i class="fas fa-plus-circle"></i> <span>Add New Car</span></a>
                <a href="BuyOrder.html"><i class="fas fa-shopping-cart"></i> <span>Buy Orders</span></a>
                <a href="rentBooking.html"><i class="fas fa-calendar-check"></i> <span>Rental Bookings</span></a>
                <a href="sellRequest.html"><i class="fas fa-handshake"></i> <span>Sell Requests</span></a>
                <a href="review.html"><i class="fas fa-star"></i> <span>Reviews</span></a>
                <a href="adminLogin.html" class="logout"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
            </div>
        </div>

    </section>


    <section>
        <div class="navbar">
            <h1 style="color:  #0a0e1a;">Add New Car</h1>

            <div class="profile">

                <i class="fas fa-user-circle" onclick="toggleMenu()"></i>

                <div class="profile-menu" id="profileMenu">

                    <a href="Setting.html">
                        <i class="fas fa-cog"></i> Settings
                    </a>

                    <a href="adminLogin.html">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>

                </div>

            </div>

            <!-- -----------------------java script------------------ -->

            <script>
                function toggleMenu() {
                    const menu = document.getElementById("profileMenu");

                    menu.style.display =
                        menu.style.display === "block"
                            ? "none"
                            : "block";
                }

                window.addEventListener("click", function (event) {

                    const menu = document.getElementById("profileMenu");
                    const profileIcon = document.querySelector(".fa-user-circle");

                    if (
                        !profileIcon.contains(event.target) &&
                        !menu.contains(event.target)
                    ) {
                        menu.style.display = "none";
                    }

                });
            </script>

    </section>

    <section class="add-car-section">

        <div class="add-car-card">

            <!-- PART 1 : TITLE -->
            <div class="add-car-title">
                <h2>
                    <i class="fa-solid fa-plus"></i>
                    Add New Car
                </h2>
            </div>


            <!-- PART 2 : FORM -->
            <form class="add-car-form">

                <div class="form-grid">

                    <!-- Car Type -->
                    <div class="form-group">
                        <label for="carType">Car Type</label>

                        <select id="carType" required>
                            <option value="">Select Car Type</option>
                            <option value="buy">Buy</option>
                            <option value="rent">Rent</option>
                        </select>
                    </div>


                    <!-- Brand -->
                    <div class="form-group">
                        <label for="brand">Brand</label>

                        <input type="text" id="brand" placeholder="e.g. Mercedes" required>
                    </div>


                    <!-- Model -->
                    <div class="form-group">
                        <label for="model">Model</label>

                        <input type="text" id="model" placeholder="e.g. GLC300" required>
                    </div>


                    <!-- Year -->
                    <div class="form-group">
                        <label for="year">Year</label>

                        <input type="number" id="year" placeholder="2024" min="1990" max="2030" required>
                    </div>


                    <!-- Price -->
                    <div class="form-group">
                        <label for="price">Price (₹)</label>

                        <input type="number" id="price" placeholder="5900000" min="0" required>
                    </div>


                    <!-- Fuel -->
                    <div class="form-group">
                        <label for="fuel">Fuel</label>

                        <select id="fuel" required>
                            <option value="">Select Fuel Type</option>
                            <option value="petrol">Petrol</option>
                            <option value="diesel">Diesel</option>
                            <option value="electric">Electric</option>
                            <option value="hybrid">Hybrid</option>
                            <option value="cng">CNG</option>
                        </select>
                    </div>


                    <!-- KM Driven -->
                    <div class="form-group">
                        <label for="km">KM Driven</label>

                        <input type="number" id="km" placeholder="0" min="0" required>
                    </div>


                    <!-- Registration -->
                    <div class="form-group">
                        <label for="registration">Registration</label>

                        <input type="text" id="registration" placeholder="Unreg / TN-01-AB-1234" required>
                    </div>


                    <!-- Availability -->
                    <div class="form-group">
                        <label for="availability">Availability</label>

                        <select id="availability" required>
                            <option value="available">Available</option>
                            <option value="sold">Sold</option>
                            <option value="booked">Booked</option>
                            <option value="unavailable">Unavailable</option>
                        </select>
                    </div>

                </div>


                <!-- Full Width Image Upload -->
                <div class="form-group full-width" id="Car-img">
                    <label for="carImage">Car Image</label>

                    <div class="img-card">
                        <label for="fileInput2">
                            <div class="photo-preview" id="photoPreview2">
                                <i class="fa-solid fa-car-side"></i>
                            </div>
                        </label>

                        <input type="file" id="fileInput2" accept="image/*" hidden
                            onchange="previewImage(event, 'photoPreview2')">
                    </div>
                </div>


                <!-- PART 3 : SAVE BUTTON -->
                <div class="save-button-box">

                    <button type="submit" class="save-car-btn">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Save Car
                    </button>

                </div>

            </form>

        </div>

    </section>

    <script>
        function previewImage(event, previewId) {

            const file = event.target.files[0];
            const preview = document.getElementById(previewId);

            if (!file) {
                return;
            }

            if (!file.type.startsWith("image/")) {
                alert("Please select an image file");
                event.target.value = "";
                return;
            }

            const reader = new FileReader();

            reader.onload = function (e) {
                preview.innerHTML = `
                <img src="${e.target.result}" alt="Car Preview">
            `;
            };

            reader.readAsDataURL(file);
        }
    </script>

</body>

</html>
