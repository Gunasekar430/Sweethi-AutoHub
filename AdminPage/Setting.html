<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Setting.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <section>
        <div class="dashboard">
            <h1><i class="fas fa-leaf"></i>Admin</h1>

            <div class="dashboard-page">
                <a href="dashboard.html"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
                <a href="manageCard.html"><i class="fas fa-car"></i> <span>Manage Cars</span></a>
                <a href="addNewCar.html"><i class="fas fa-plus-circle"></i> <span>Add New Car</span></a>
                <a href="BuyOrder.html"><i class="fas fa-shopping-cart"></i> <span>Buy Orders</span></a>
                <a href="rentBooking.html"><i class="fas fa-calendar-check"></i> <span>Rental Bookings</span></a>
                <a href="sellRequest.html"><i class="fas fa-handshake"></i> <span>Sell Requests</span></a>
                <a href="review.html"><i class="fas fa-star"></i> <span>Reviews</span></a>
                <a href="adminLogin.html" class="logout"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
            </div>
        </div>

    </section>


    <section>
        <div class="navbar">
            <h1 style="color:  #0a0e1a;">Setting</h1>

            <div class="profile">

                <i class="fas fa-user-circle" onclick="toggleMenu()"></i>

                <div class="profile-menu" id="profileMenu">

                    <a href="Setting.html">
                        <i class="fas fa-cog"></i> Settings
                    </a>

                    <a href="adminLogin.html">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>

                </div>

            </div>

            <!-- -----------------------java script------------------ -->

            <script>
                function toggleMenu() {
                    const menu = document.getElementById("profileMenu");

                    menu.style.display =
                        menu.style.display === "block"
                            ? "none"
                            : "block";
                }

                window.addEventListener("click", function (event) {

                    const menu = document.getElementById("profileMenu");
                    const profileIcon = document.querySelector(".fa-user-circle");

                    if (
                        !profileIcon.contains(event.target) &&
                        !menu.contains(event.target)
                    ) {
                        menu.style.display = "none";
                    }

                });
            </script>

    </section>

    <section class="settings-section">

    <div class="settings-card">

        <div class="settings-title">
            <h2>
                <i class="fa-solid fa-gear"></i>
                Admin Settings
            </h2>
        </div>

        <!-- ==================== ADMIN ACCOUNT ==================== -->

        <div class="settings-part">

            <h3>
                <i class="fa-solid fa-user-shield"></i>
                Admin Account
            </h3>

            <div class="settings-grid">

                <div class="form-group">
                    <label>Admin Name</label>
                    <input type="text" placeholder="Enter admin name">
                </div>

                <div class="form-group">
                    <label>Admin Login Email</label>
                    <input type="email" placeholder="admin@example.com">
                </div>

                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" placeholder="Enter current password">
                </div>

                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" placeholder="Enter new password">
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm new password">
                </div>

            </div>

        </div>

        <!-- ==================== CUSTOMER SUPPORT ==================== -->

        <div class="settings-part">

            <h3>
                <i class="fa-solid fa-headset"></i>
                Customer Support
            </h3>

            <div class="settings-grid">

                <div class="form-group">
                    <label>Support Phone</label>
                    <input type="tel" placeholder="+91 98765 43210">
                </div>

                <div class="form-group">
                    <label>Support Email</label>
                    <input type="email" placeholder="support@example.com">
                </div>

            </div>

        </div>

        <!-- ==================== RENTAL SETTINGS ==================== -->

        <div class="settings-part">

            <h3>
                <i class="fa-solid fa-car"></i>
                Rental Settings
            </h3>

            <div class="settings-grid">

                <div class="form-group">
                    <label>Min Rental Days</label>
                    <input type="number" placeholder="1">
                </div>

                <div class="form-group">
                    <label>Max Rental Days</label>
                    <input type="number" placeholder="14">
                </div>

                <div class="form-group">
                    <label>Security Deposit (₹)</label>
                    <input type="number" placeholder="5000">
                </div>

                <div class="form-group">
                    <label>Late Return Charge (₹ / Day)</label>
                    <input type="number" placeholder="1000">
                </div>

                <div class="form-group full-width">
                    <label>Rental Rules / T&C</label>
                    <textarea placeholder="Enter rental terms and conditions"></textarea>
                </div>

            </div>

        </div>

        <button class="save-settings-btn">
            <i class="fa-solid fa-floppy-disk"></i>
            Save Settings
        </button>

    </div>

</section>

</body>
</html>
