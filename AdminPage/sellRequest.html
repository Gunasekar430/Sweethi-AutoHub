<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="sellRequest.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <section>
        <div class="dashboard">
            <h1><i class="fas fa-leaf"></i>Admin</h1>

            <div class="dashboard-page">
                <a href="dashboard.html"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
                <a href="manageCard.html"><i class="fas fa-car"></i> <span>Manage Cars</span></a>
                <a href="addNewCar.html"><i class="fas fa-plus-circle"></i> <span>Add New Car</span></a>
                <a href="BuyOrder.html"><i class="fas fa-shopping-cart"></i> <span>Buy Orders</span></a>
                <a href="rentBooking.html"><i class="fas fa-calendar-check"></i> <span>Rental Bookings</span></a>
                <a href="sellRequest.html"><i class="fas fa-handshake"></i> <span>Sell Requests</span></a>
                <a href="review.html"><i class="fas fa-star"></i> <span>Reviews</span></a>
                <a href="adminLogin.html" class="logout"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
            </div>
        </div>

    </section>


    <section>
        <div class="navbar">
            <h1 style="color:  #0a0e1a;">Sell Requests</h1>

            <div class="profile">

                <i class="fas fa-user-circle" onclick="toggleMenu()"></i>

                <div class="profile-menu" id="profileMenu">

                    <a href="Setting.html">
                        <i class="fas fa-cog"></i> Settings
                    </a>

                    <a href="adminLogin.html">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>

                </div>

            </div>

            <!-- -----------------------java script------------------ -->

            <script>
                function toggleMenu() {
                    const menu = document.getElementById("profileMenu");

                    menu.style.display =
                        menu.style.display === "block"
                            ? "none"
                            : "block";
                }

                window.addEventListener("click", function (event) {

                    const menu = document.getElementById("profileMenu");
                    const profileIcon = document.querySelector(".fa-user-circle");

                    if (
                        !profileIcon.contains(event.target) &&
                        !menu.contains(event.target)
                    ) {
                        menu.style.display = "none";
                    }

                });
            </script>

    </section>

    <section class="sell-request-section">

    <div class="sell-request-card">

        <!-- TITLE -->
        <div class="sell-request-title">
            <h2>
                <i class="fa-solid fa-upload"></i>
                Sell Requests (Customer Uploads)
            </h2>
        </div>

        <!-- TABLE -->
        <div class="sell-table-wrapper">

            <table class="sell-request-table">

                <thead>
                    <tr>
                        <th>Owner</th>
                        <th>Car</th>
                        <th>Year</th>
                        <th>KM</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    <!-- REQUEST 1 -->
                    <tr>
                        <td>Rahul Verma</td>

                        <td>Toyota Innova Crysta</td>

                        <td>2022</td>

                        <td>45000</td>

                        <td>
                            <span class="sell-status sell-pending">
                                Pending
                            </span>
                        </td>

                        <td>
                            <div class="sell-actions">

                                <button class="sell-view-btn">
                                    <i class="fa-solid fa-eye"></i>
                                    View
                                </button>

                                <button class="sell-approve-btn">
                                    Approve
                                </button>

                                <button class="sell-reject-btn">
                                    Reject
                                </button>

                            </div>
                        </td>
                    </tr>


                    <!-- REQUEST 2 -->
                    <tr>
                        <td>Ananya Iyer</td>

                        <td>Hyundai Creta</td>

                        <td>2023</td>

                        <td>22000</td>

                        <td>
                            <span class="sell-status sell-pending">
                                Pending
                            </span>
                        </td>

                        <td>
                            <div class="sell-actions">

                                <button class="sell-view-btn">
                                    <i class="fa-solid fa-eye"></i>
                                    View
                                </button>

                                <button class="sell-approve-btn">
                                    Approve
                                </button>

                                <button class="sell-reject-btn">
                                    Reject
                                </button>

                            </div>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</section>

</body>
</html>
